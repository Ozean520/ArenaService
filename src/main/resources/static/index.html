<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ArenaServer Test</title>
</head>
<body>
<h2>ArenaServer - WebSocket Test</h2>

<p id="status">尚未连接</p>

<button id="createRoom" disabled>
    创建房间
</button>

<pre id="log"></pre>

<script>
    const status = document.getElementById("status");
    const log = document.getElementById("log");
    const button = document.getElementById("createRoom");

    const protocol = location.protocol === "https:"
        ? "wss:" : "ws:";

    const ws = new WebSocket(
        `${protocol}//${location.host}/ws`
    );

    ws.onopen = () => {
        status.textContent = "WebSocket 已连接";
        button.disabled = false;
    };

    ws.onmessage = (event) => {
        log.textContent += event.data + "\n";
    };

    ws.onclose = () => {
        status.textContent = "WebSocket 已断开";
        button.disabled = true;
    };

    button.onclick = () => {
        ws.send(JSON.stringify({
            type: "CREATE_ROOM"
        }));
    };
</script>
</body>
</html>
